# Denly detection taxonomy — the single source of truth for detection classes (ADR 0006).
#
# - ids are contiguous from 0; they FREEZE at the first model version and are append-only after.
# - names: lowercase snake_case English. Filipino (tl) and Bisaya (ceb) names are aliases = data.
# - tier A = Philippine priority (scraping + own photos); tier B = global, public data only.
# - sources: what each public dataset calls this class; a puller maps those labels to our id.
#   Labels not found in a source are reported by the puller, never silently ignored.
# - Packaged items (bottles, sachets, cans, cartons) are NOT classes; they are background images.
version: "2026.09.2"
sources:
  open_images: Open Images V7 boxable display names
  lvis: LVIS v1 category names
  vid: Vegetable Image Dataset (Kaggle, misrakahmed) folder names
  commons: Wikimedia Commons — "Category:X" (walked one subcategory level deep) or a file search term
  roboflow_fv: Roboflow Universe fvd-v2/fruits-and-vegetables-yz9mm v2 class names (local export; "hot pepper" deliberately unmapped — mixes long and small chili)
  inaturalist: iNaturalist taxon names (research-grade observations, CC0 / CC BY / CC BY-SA photos)
classes:
  - { id: 0,  name: egg,                 tier: A, group: egg,       aliases: { tl: [itlog], ceb: [itlog], en: [eggs, chicken egg] },                                        sources: { open_images: ["Egg (Food)"], lvis: [egg] } }
